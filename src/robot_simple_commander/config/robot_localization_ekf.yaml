# EKF fusing wheel odometry + IMU -> /odometry/filtered and odom->base_link TF.
# Based on the upstream roverrobotics localization_ekf.yaml, kept in this
# package so RoboGait tuning stays separate from the upstream repository.
ekf_filter_node:
    ros__parameters:
        use_sim_time: false
        frequency: 30.0
        sensor_timeout: 1.0
        two_d_mode: true
        transform_time_offset: 0.0
        transform_timeout: 0.0
        print_diagnostics: true
        debug: false
        publish_tf: true
        publish_acceleration: false
        reset_on_time_jump: true

        map_frame: map
        odom_frame: odom
        base_link_frame: base_link
        world_frame: odom

        # Wheel odometry: fuse x/y velocity only.
        odom0: odometry/wheels
        odom0_config: [false, false, false,
                       false, false, false,
                       true,  true,  false,
                       false, false, false,
                       false, false, false]
        odom0_queue_size: 10
        odom0_nodelay: true
        odom0_differential: false
        odom0_relative: true

        # IMU: fuse yaw rate.
        imu0: imu/data
        imu0_config: [false, false, false,
                      false, false, false,
                      false, false, false,
                      false, false, true,
                      false, false, false]
        imu0_nodelay: true
        imu0_differential: false
        imu0_relative: true
        imu0_queue_size: 12
        imu0_remove_gravitational_acceleration: true

        use_control: false
